  <defs>
    <linearGradient id="g" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6D46FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <mask id="m">
      <path d="M 16 16 L 58 50 L 16 84" fill="none" stroke="#fff"
